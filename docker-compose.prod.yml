# Production. The server runs this file as it is: infrastructure/ansible copies it there, with a Caddyfile,
# backend.env (settings and secrets) and a .env naming the image tag. The database is RDS, so there is none here.
# For development use docker-compose.yml.
name: crate

x-service: &service
  restart: unless-stopped
  logging:
    options:
      max-size: 10m
      max-file: "3"

services:
  caddy:
    <<: *service
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates
      - caddy_config:/config
    depends_on:
      - frontend

  frontend:
    <<: *service
    image: ${IMAGE_REGISTRY:-ghcr.io/rronss}/inventory-app-frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend

  backend:
    <<: *service
    image: ${IMAGE_REGISTRY:-ghcr.io/rronss}/inventory-app-backend:${IMAGE_TAG:-latest}
    env_file:
      - backend.env
    environment:
      TRUSTED_PROXIES: 2 # Caddy, then the frontend's nginx

volumes:
  caddy_data:
  caddy_config:
