server {
    listen 8080;
    root /usr/share/nginx/html;

    # room for item images; the backend enforces the real limit (2 MB)
    client_max_body_size 3m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
